name: Release

# Wird nur ausgelöst, wenn ein Tag wie v0.1.0 gepusht wird.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Veröffentlichen (Windows x64, selbstständig, ohne installiertes .NET)
        run: dotnet publish WingScenes.csproj -c Release -r win-x64 --self-contained true -o publish

      - name: Zip erstellen
        shell: pwsh
        run: |
          Copy-Item README.md publish/
          Compress-Archive -Path publish/* -DestinationPath "WingScenes-${{ github.ref_name }}-win-x64.zip"

      - name: Release anlegen
        uses: softprops/action-gh-release@v2
        with:
          files: WingScenes-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          # Solange die Software nicht an einer echten Wing getestet ist, als Vorabversion markieren
          prerelease: true
